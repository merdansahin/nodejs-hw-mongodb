tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      default: 1
    description: Page number for pagination.
  - in: query
    name: limit
    schema:
      type: integer
      default: 10
    description: Number of items per page.
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter by favourite status.
  - in: query
    name: contactType
    schema:
      type: string
      enum: ['work', 'home', 'personal']
    description: Filter by contact type.
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/schemas/responses/unauthorized.yaml'
