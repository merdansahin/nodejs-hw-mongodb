openapi: 3.0.0
info:
  title: Contacts API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api/v1
    description: Local Development Server

paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml

  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/contactId/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/contactId/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/contactId/delete.yaml
  /auth/register:
    post:
      $ref: ../swagger/paths/auth/register.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/auth/login.yaml
  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/logout.yaml
  /auth/refresh:
    post:
      $ref: ../swagger/paths/auth/refresh.yaml

components:
  schemas:
    Contact:
      $ref: ./contact.yaml
  securitySchemes:
    bearerAuth:
      $ref: ../swagger/components/securitySchemes/bearerAuth.yaml
  responses:
    NotFound:
      $ref: ../swagger/components/schemas/responses/notFound.yaml
    Unauthorized:
      $ref: ../swagger/components/schemas/responses/unauthorized.yaml
